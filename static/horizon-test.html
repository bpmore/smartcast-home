<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Test</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#e8ecf3;
    font:400 2vw/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.5vh;
    background:radial-gradient(120vw 80vh at 50% 30%, #122244 0%, #05070d 70%)}
  h1{font-size:7vw;margin:0;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(90deg,#5b8cff,#8f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:2.6vw;margin:0;color:#aab4c5;max-width:70vw}
  .ok{font-size:3.4vw;color:#34d399;font-weight:600}
  .clock{font-size:2vw;color:#667085;margin-top:1vh}
  .dot{display:inline-block;width:2.2vw;height:2.2vw;border-radius:50%;background:#34d399;
    box-shadow:0 0 4vw #34d399;animation:p 1.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>HORIZON TEST</h1>
    <p class="ok">If you can read this on the TV, the web launcher works.</p>
    <p>Served from Tank · the Vizio rendered a custom HTML page through Conjure.</p>
    <div class="clock" id="clk"></div>
  </div>
<script>
  function t(){document.getElementById('clk').textContent='live · '+new Date().toLocaleTimeString();}
  t(); setInterval(t,1000);
</script>
</body>
</html>
